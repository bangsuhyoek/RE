name: RE v2.0.2 Canonical Source Clean Rebuild

on:
  push:
    branches:
      - chatgpt/v2.0.3-canonical-baseline
    paths:
      - .github/workflows/canonical-source-clean.yml
      - canonical-source-clean-trigger.txt
  workflow_dispatch:

jobs:
  clean-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Download proven canonical artifact
        uses: actions/download-artifact@v4
        with:
          name: re-v2.0.2-canonical-baseline
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35135721151

      - name: Download exact Golden Product Baseline
        uses: actions/download-artifact@v4
        with:
          name: re-v2.0.2-golden-product-baseline
          path: golden
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35171158055

      - name: Build cleaned canonical source package
        shell: bash
        run: |
          set -euo pipefail
          echo "=== proven artifact paths ==="
          find artifact -type f -print | sort
          echo "=== golden artifact paths ==="
          find golden -type f -print | sort

          GOLDEN=$(find golden -type f -name 'v2.0.2_수정.apk' -print -quit)
          test -n "$GOLDEN"
          test -s "$GOLDEN"
          echo "c52bd20769fb84d8d4d882c7a985f3f792aa038184750dce9a86104efe77e7ac  $GOLDEN" | sha256sum -c -

          rm -rf source-clean source-test RE_v2.0.2_CANONICAL_SOURCE_CLEAN.zip
          mkdir -p source-clean/RE_v2.0.2_CANONICAL_SOURCE/canonical-web/public source-test
          ROOT="$PWD/source-clean/RE_v2.0.2_CANONICAL_SOURCE"

          rsync -a \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/build-support/' \
            --exclude '/node_modules/' \
            --exclude '/dist/' \
            --exclude '/src/' \
            --exclude '/public/' \
            --exclude '/tests/' \
            --exclude '/android/.gradle/' \
            --exclude '/android/build/' \
            --exclude '/android/app/build/' \
            --exclude '/canonical-web/' \
            --exclude '/canonical-parity-trigger.txt' \
            --exclude '/canonical-source-clean-trigger.txt' \
            --exclude '*.apk' \
            --exclude '*.aab' \
            --exclude '*.aar' \
            --exclude '*.zip' \
            ./ "$ROOT/"

          python3 - "$GOLDEN" "$ROOT/canonical-web/public" <<'PY'
          import sys, zipfile, pathlib, hashlib, json
          apk,out=sys.argv[1:3]
          out=pathlib.Path(out)
          files={}
          with zipfile.ZipFile(apk) as z:
              for name in z.namelist():
                  prefix='assets/public/'
                  if not name.startswith(prefix) or name.endswith('/'):
                      continue
                  rel=name[len(prefix):]
                  dest=out/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  data=z.read(name)
                  dest.write_bytes(data)
                  files[rel]=hashlib.sha256(data).hexdigest()
          print(json.dumps({'web_files':len(files)},indent=2))
          if len(files)!=133:
              raise SystemExit(f'expected 133 WebView files, got {len(files)}')
          pathlib.Path('clean-web-hashes.json').write_text(json.dumps(files,indent=2),encoding='utf-8')
          PY

          cat > "$ROOT/canonical-build.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT=$(cd "$(dirname "$0")" && pwd)
          cd "$ROOT"
          test -f canonical-web/public/index.html
          test "$(find canonical-web/public -type f | wc -l)" -eq 133
          rm -rf dist
          mkdir -p dist
          cp -a canonical-web/public/. dist/
          pnpm install --frozen-lockfile
          npx cap sync android
          chmod +x android/gradlew
          (cd android && ./gradlew clean assembleDebug assembleRelease --stacktrace)
          EOF
          chmod +x "$ROOT/canonical-build.sh"

          cat > "$ROOT/CANONICAL_BASELINE_PROVENANCE.md" <<'EOF'
          # RE v2.0.2 canonical baseline

          Golden Product Baseline: v2.0.2_수정.apk
          Golden APK SHA-256: c52bd20769fb84d8d4d882c7a985f3f792aa038184750dce9a86104efe77e7ac
          Native donor commit: d3d85ff816fd7ae340e72b8be5b0a2181e666b1f
          Exact WebView file count: 133

          The canonical UI is canonical-web/public, extracted byte-for-byte from the Golden APK.
          Donor React/Vite root src/ and public/ are intentionally excluded.
          Test harness code under build-support/ and all 2.5D PoC code are excluded.
          EOF

          test -f "$ROOT/android/app/src/main/AndroidManifest.xml"
          test -d "$ROOT/android/app/src/main/java"
          test "$(find "$ROOT/canonical-web/public" -type f | wc -l)" -eq 133
          ! find "$ROOT" -type d \( -name build -o -name .gradle -o -name node_modules -o -name .cxx \) -print | grep -q .
          ! find "$ROOT" -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.aar' \) -print | grep -q .
          if grep -R "AnimatedConciergeOverlayController\|PocPaymentTriggerActivity\|PocPaymentReceiver" "$ROOT/android/app/src/main"; then
            echo "unexpected 2.5D PoC test/controller code in canonical baseline" >&2
            exit 1
          fi
          if grep -q "android.permission.SYSTEM_ALERT_WINDOW" "$ROOT/android/app/src/main/AndroidManifest.xml"; then
            echo "unexpected SYSTEM_ALERT_WINDOW manifest permission in canonical baseline" >&2
            exit 1
          fi

          (cd source-clean && zip -qr ../RE_v2.0.2_CANONICAL_SOURCE_CLEAN.zip RE_v2.0.2_CANONICAL_SOURCE)
          sha256sum RE_v2.0.2_CANONICAL_SOURCE_CLEAN.zip | tee clean-source.sha256
          unzip -q RE_v2.0.2_CANONICAL_SOURCE_CLEAN.zip -d source-test
          test -x source-test/RE_v2.0.2_CANONICAL_SOURCE/canonical-build.sh

      - name: Clean unzip to clean build
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$PWD/source-test/RE_v2.0.2_CANONICAL_SOURCE"
          (cd "$TEST_ROOT" && ./canonical-build.sh)
          DEBUG="$TEST_ROOT/android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE="$TEST_ROOT/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$DEBUG"
          test -s "$RELEASE"
          unzip -t "$DEBUG" >/dev/null
          unzip -t "$RELEASE" >/dev/null
          sha256sum "$DEBUG" "$RELEASE" | tee clean-rebuild-apks.sha256

      - name: Verify clean rebuild parity against Golden
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$PWD/source-test/RE_v2.0.2_CANONICAL_SOURCE"
          RELEASE="$TEST_ROOT/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          GOLDEN=$(find golden -type f -name 'v2.0.2_수정.apk' -print -quit)
          python3 - "$RELEASE" "$GOLDEN" <<'PY'
          import sys, zipfile, hashlib, json, pathlib
          rebuilt,golden=sys.argv[1:3]
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  return {n:hashlib.sha256(z.read(n)).hexdigest()
                          for n in z.namelist()
                          if not n.startswith('META-INF/') and not n.endswith('/')}
          r=payload(rebuilt); g=payload(golden)
          report={
              'golden_count':len(g),
              'rebuilt_count':len(r),
              'missing_in_rebuilt':sorted(set(g)-set(r)),
              'extra_in_rebuilt':sorted(set(r)-set(g)),
              'changed':sorted(k for k in set(g)&set(r) if g[k]!=r[k]),
          }
          report['pass']=not report['missing_in_rebuilt'] and not report['extra_in_rebuilt'] and not report['changed']
          pathlib.Path('clean-source-payload-parity.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not report['pass']:
              raise SystemExit(1)
          PY
          echo "CANONICAL_SOURCE_CLEAN_BUILD=PASS" | tee clean-source-result.txt

      - name: Upload cleaned canonical source evidence
        uses: actions/upload-artifact@v4
        with:
          name: re-v2.0.2-canonical-source-clean
          path: |
            RE_v2.0.2_CANONICAL_SOURCE_CLEAN.zip
            clean-source.sha256
            clean-rebuild-apks.sha256
            clean-source-payload-parity.json
            clean-source-result.txt
            clean-web-hashes.json
          if-no-files-found: error
          retention-days: 90
