name: Build Android APK

on:
  push:
    branches:
      - main
      - chatgpt/v1.0.6-runtime-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm test

      - name: Build Web Assets
        run: pnpm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Validate APK package
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee v1.0.6-native.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-v1.0.6-native-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            v1.0.6-native.sha256
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: re-v1.0.6-native-debug-apk
          path: artifact

      - name: Android launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            APK=$(find artifact -type f -name '*.apk' -print -quit) &&
            test -n "$APK" &&
            test -s "$APK" &&
            adb install -r "$APK" &&
            adb logcat -c &&
            adb shell am force-stop kr.co.re.subscription &&
            LAUNCHER=$(adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER kr.co.re.subscription | tr -d '\r' | tail -n 1) &&
            echo "Resolved launcher: $LAUNCHER" &&
            test -n "$LAUNCHER" &&
            adb shell am start -n "$LAUNCHER" &&
            sleep 8 &&
            adb shell dumpsys activity activities | grep -q "kr.co.re.subscription" &&
            ( ! adb logcat -d -v brief | grep -E "FATAL EXCEPTION|Process: kr.co.re.subscription" | grep -q . ) &&
            adb shell am start -a android.intent.action.VIEW -d "reapp://payment/candidate?id=smoke-test&source=heads-up" kr.co.re.subscription &&
            sleep 4 &&
            adb shell dumpsys activity activities | grep -q "kr.co.re.subscription" &&
            ( ! adb logcat -d -v brief | grep -E "FATAL EXCEPTION|Process: kr.co.re.subscription" | grep -q . )
