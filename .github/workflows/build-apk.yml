name: Build Android APK

on:
  push:
    branches:
      - main
      - chatgpt/v1.0.6-runtime-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm test

      - name: Build Web Assets
        run: pnpm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Validate APK package
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee v1.0.6-native.sha256

      - name: Collect Android signing tools
        run: |
          set -euo pipefail
          mkdir -p android-signing-tools/lib
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          TOOL_DIR="$(dirname "$APKSIGNER")"
          cp "$APKSIGNER" android-signing-tools/apksigner
          cp "$TOOL_DIR/lib/apksigner.jar" android-signing-tools/lib/apksigner.jar
          cp "$TOOL_DIR/zipalign" android-signing-tools/zipalign
          cp "$TOOL_DIR/aapt2" android-signing-tools/aapt2
          cp "$HOME/.android/debug.keystore" android-signing-tools/debug.keystore
          chmod +x android-signing-tools/apksigner android-signing-tools/zipalign android-signing-tools/aapt2

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-v1.0.6-native-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            v1.0.6-native.sha256
          if-no-files-found: error

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: re-v1.0.6-android-signing-tools
          path: android-signing-tools
          if-no-files-found: error
