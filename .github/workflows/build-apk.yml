name: Build Android APK

on:
  push:
    branches:
      - main
      - chatgpt/v1.0.6-runtime-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm test

      - name: Build Web Assets
        run: pnpm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | sed -n '1,120p'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build debug and release APKs
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Validate native APKs
        run: |
          set -euxo pipefail
          DEBUG=android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$DEBUG"
          test -s "$RELEASE"
          unzip -t "$DEBUG" >/dev/null
          unzip -t "$RELEASE" >/dev/null
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BT/aapt2" dump badging "$RELEASE" | tee release-badging.txt
          grep -q "package: name='kr.co.re.subscription' versionCode='202' versionName='2.0.2'" release-badging.txt
          if "$BT/aapt2" dump permissions "$RELEASE" | grep -E "SYSTEM_ALERT_WINDOW|android.permission.CAMERA"; then
            echo "Forbidden/unused permission found in release APK" >&2
            exit 1
          fi
          sha256sum "$DEBUG" "$RELEASE" | tee native-apk.sha256

      - name: Upload native APKs
        uses: actions/upload-artifact@v4
        with:
          name: re-v2.0.2-native-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            release-badging.txt
            native-apk.sha256
          if-no-files-found: error

      - name: Export Android build tools
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p tool-export/lib
          cp "$BT/apksigner" tool-export/
          cp "$BT/zipalign" tool-export/
          cp "$BT/aapt2" tool-export/
          cp "$BT/dexdump" tool-export/ || true
          cp "$BT/lib/apksigner.jar" tool-export/lib/
          chmod +x tool-export/apksigner tool-export/zipalign tool-export/aapt2 tool-export/dexdump 2>/dev/null || true

      - name: Upload Android build tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-v2.0.2
          path: tool-export
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: re-v2.0.2-native-apks
          path: artifact

      - name: Android launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            APK=$(find artifact -type f -name 'app-debug.apk' -print -quit) &&
            test -n "$APK" &&
            adb install -r "$APK" &&
            adb logcat -c &&
            adb shell am force-stop kr.co.re.subscription &&
            LAUNCHER=$(adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER kr.co.re.subscription | tr -d '\r' | tail -n 1) &&
            test -n "$LAUNCHER" &&
            adb shell am start -n "$LAUNCHER" &&
            sleep 8 &&
            adb shell dumpsys activity activities | grep -q "kr.co.re.subscription" &&
            ( ! adb logcat -d -v brief | grep -E "FATAL EXCEPTION|Process: kr.co.re.subscription" | grep -q . ) &&
            adb shell am start -a android.intent.action.VIEW -d "reapp://payment/candidate?id=smoke-test" kr.co.re.subscription &&
            sleep 4 &&
            adb shell dumpsys activity activities | grep -q "kr.co.re.subscription" &&
            ( ! adb logcat -d -v brief | grep -E "FATAL EXCEPTION|Process: kr.co.re.subscription" | grep -q . )
