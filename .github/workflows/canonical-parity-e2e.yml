name: RE v2.0.2 Golden Runtime Parity

on:
  push:
    branches:
      - chatgpt/v2.0.3-canonical-baseline
    paths:
      - canonical-parity-trigger.txt

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      GOLDEN_APK_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-37c8-8209-8ea4-d0db1daf4cd0/raw?se=2026-09-17T01%3A29%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=c2185db4-7aeb-510b-9e7a-85d8e2dc7885&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T23%3A49%3A19Z&ske=2026-09-17T23%3A49%3A19Z&sks=b&skv=2026-02-06&sig=6NefWtJmbdtIr0DTc9RkkfwtnlFMG5rTWVdInueLhSo%3D'
      GOLDEN_APK_SHA256: c52bd20769fb84d8d4d882c7a985f3f792aa038184750dce9a86104efe77e7ac
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install visual diff tooling
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Build external parity instrumentation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          android/gradlew -p build-support/parity-instrumentation assembleDebug --stacktrace
          QA=$(find build-support/parity-instrumentation/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$QA"
          test -s "$QA"
          cp "$QA" qa-parity.apk
          unzip -t qa-parity.apk >/dev/null
          sha256sum qa-parity.apk | tee qa-parity.sha256

      - name: Download proven rebuilt canonical artifact
        uses: actions/download-artifact@v4
        with:
          name: re-v2.0.2-canonical-baseline
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35135721151

      - name: Download exact Golden Product Baseline APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p golden
          curl -L --fail --retry 3 --retry-delay 2 "$GOLDEN_APK_URL" -o golden/v2.0.2_golden.apk
          echo "$GOLDEN_APK_SHA256  golden/v2.0.2_golden.apk" | sha256sum -c -
          unzip -t golden/v2.0.2_golden.apk >/dev/null

      - name: Reconfirm APK payload parity before runtime
        shell: bash
        run: |
          set -euo pipefail
          REBUILT=$(find artifact -type f -name canonical-baseline.apk -print -quit)
          test -n "$REBUILT"
          python3 - "$REBUILT" golden/v2.0.2_golden.apk <<'PY'
          import sys, zipfile, hashlib, json
          rebuilt,golden=sys.argv[1:3]
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  return {
                      n: hashlib.sha256(z.read(n)).hexdigest()
                      for n in z.namelist()
                      if not n.startswith("META-INF/") and not n.endswith("/")
                  }
          r=payload(rebuilt); g=payload(golden)
          report={
              "golden_count":len(g),"rebuilt_count":len(r),
              "missing_in_rebuilt":sorted(set(g)-set(r)),
              "extra_in_rebuilt":sorted(set(r)-set(g)),
              "changed":sorted(k for k in set(g)&set(r) if g[k]!=r[k]),
          }
          report["pass"]=not report["missing_in_rebuilt"] and not report["extra_in_rebuilt"] and not report["changed"]
          open("payload-parity-runtime.json","w",encoding="utf-8").write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not report["pass"]: raise SystemExit(1)
          PY

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run Golden vs rebuilt functional and visual parity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash build-support/run-canonical-parity-e2e.sh artifact golden/v2.0.2_golden.apk qa-parity.apk

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: re-v2.0.2-golden-runtime-parity
          path: |
            e2e
            payload-parity-runtime.json
            qa-parity.sha256
          if-no-files-found: warn
