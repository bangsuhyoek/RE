name: RE v2.0.2 Golden Runtime Parity

on:
  push:
    branches:
      - chatgpt/v2.0.3-canonical-baseline
    paths:
      - canonical-parity-trigger.txt

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install visual diff tooling
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Build external parity instrumentation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          android/gradlew -p build-support/parity-instrumentation assembleDebug --stacktrace
          QA=$(find build-support/parity-instrumentation/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$QA"
          test -s "$QA"
          cp "$QA" qa-parity.apk
          unzip -t qa-parity.apk >/dev/null
          sha256sum qa-parity.apk | tee qa-parity.sha256

      - name: Download proven rebuilt canonical artifact
        uses: actions/download-artifact@v4
        with:
          name: re-v2.0.2-canonical-baseline
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35135721151

      - name: Download exact Golden Product Baseline APK
        uses: actions/download-artifact@v4
        with:
          name: re-v2.0.2-golden-product-baseline
          path: golden
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35171158055

      - name: Verify downloaded runtime inputs and actual paths
        shell: bash
        run: |
          set -euo pipefail
          echo "=== rebuilt artifact files ==="
          find artifact -type f -print | sort
          echo "=== golden artifact files ==="
          find golden -type f -print | sort
          REBUILT=$(find artifact -type f -name canonical-baseline.apk -print -quit)
          GOLDEN=$(find golden -type f -name 'v2.0.2_수정.apk' -print -quit)
          test -n "$REBUILT"
          test -s "$REBUILT"
          test -n "$GOLDEN"
          test -s "$GOLDEN"
          echo "REBUILT_APK=$REBUILT"
          echo "GOLDEN_APK=$GOLDEN"
          sha256sum "$REBUILT" "$GOLDEN"
          echo "c52bd20769fb84d8d4d882c7a985f3f792aa038184750dce9a86104efe77e7ac  $GOLDEN" | sha256sum -c -
          unzip -t "$REBUILT" >/dev/null
          unzip -t "$GOLDEN" >/dev/null

      - name: Reconfirm APK payload parity before runtime
        shell: bash
        run: |
          set -euo pipefail
          REBUILT=$(find artifact -type f -name canonical-baseline.apk -print -quit)
          test -n "$REBUILT"
          python3 - "$REBUILT" golden/v2.0.2_수정.apk <<'PY'
          import sys, zipfile, hashlib, json
          rebuilt,golden=sys.argv[1:3]
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  return {
                      n: hashlib.sha256(z.read(n)).hexdigest()
                      for n in z.namelist()
                      if not n.startswith("META-INF/") and not n.endswith("/")
                  }
          r=payload(rebuilt); g=payload(golden)
          report={
              "golden_count":len(g),"rebuilt_count":len(r),
              "missing_in_rebuilt":sorted(set(g)-set(r)),
              "extra_in_rebuilt":sorted(set(r)-set(g)),
              "changed":sorted(k for k in set(g)&set(r) if g[k]!=r[k]),
          }
          report["pass"]=not report["missing_in_rebuilt"] and not report["extra_in_rebuilt"] and not report["changed"]
          open("payload-parity-runtime.json","w",encoding="utf-8").write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not report["pass"]: raise SystemExit(1)
          PY

      - name: Prepare common-signed runtime copies for instrumentation
        shell: bash
        run: |
          set -euo pipefail
          REBUILT=$(find artifact -type f -name canonical-baseline.apk -print -quit)
          GOLDEN=$(find golden -type f -name 'v2.0.2_수정.apk' -print -quit)
          test -n "$REBUILT"
          test -s "$REBUILT"
          test -n "$GOLDEN"
          test -s "$GOLDEN"
          test -s qa-parity.apk

          mkdir -p runtime/rebuilt runtime
          KS="$PWD/runtime/parity-runtime.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KS" -storepass paritypass -keypass paritypass \
            -alias parity -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=RE Canonical Parity QA,O=RE,C=KR"

          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

          resign() {
            local input="$1"
            local output="$2"
            local work
            work=$(mktemp -d)
            cp "$input" "$work/input.apk"
            zip -qd "$work/input.apk" 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/*.MF' || true
            "$BT/zipalign" -p -f 4 "$work/input.apk" "$work/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$KS" --ks-key-alias parity \
              --ks-pass pass:paritypass --key-pass pass:paritypass \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$output" "$work/aligned.apk"
            "$BT/apksigner" verify --verbose --print-certs "$output"
            rm -rf "$work"
          }

          resign "$REBUILT" runtime/rebuilt/canonical-baseline.apk
          resign "$GOLDEN" runtime/golden-runtime.apk
          resign qa-parity.apk runtime/qa-runtime.apk

          sha256sum "$REBUILT" "$GOLDEN" qa-parity.apk \
            runtime/rebuilt/canonical-baseline.apk runtime/golden-runtime.apk runtime/qa-runtime.apk \
            | tee runtime/runtime-apks.sha256

          python3 - "$REBUILT" runtime/rebuilt/canonical-baseline.apk "$GOLDEN" runtime/golden-runtime.apk <<'PY'
          import sys,zipfile,hashlib,json,pathlib
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  return {n:hashlib.sha256(z.read(n)).hexdigest()
                          for n in z.namelist()
                          if not n.startswith("META-INF/") and not n.endswith("/")}
          pairs=[("rebuilt",sys.argv[1],sys.argv[2]),("golden",sys.argv[3],sys.argv[4])]
          report={}
          for name,orig,signed in pairs:
              a=payload(orig); b=payload(signed)
              report[name]={"original_count":len(a),"runtime_count":len(b),"pass":a==b}
              if a!=b:
                  raise SystemExit(f"{name} runtime re-sign changed non-signing payload")
          pathlib.Path("runtime/runtime-resign-parity.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run Golden vs rebuilt functional and visual parity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash build-support/run-canonical-parity-e2e.sh runtime/rebuilt runtime/golden-runtime.apk runtime/qa-runtime.apk

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: re-v2.0.2-golden-runtime-parity
          path: |
            e2e
            payload-parity-runtime.json
            qa-parity.sha256
            runtime/runtime-apks.sha256
            runtime/runtime-resign-parity.json
          if-no-files-found: warn
