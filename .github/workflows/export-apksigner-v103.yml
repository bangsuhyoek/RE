name: Export Android apksigner tool

on:
  push:
    branches:
      - codex/re-v1.0.3-concierge
    paths:
      - '.github/workflows/export-apksigner-v103.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Collect apksigner
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/apksigner.jar
          test -s out/apksigner.jar
          sha256sum out/apksigner.jar > out/apksigner.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: apksigner-v103
          path: out/*
          if-no-files-found: error
