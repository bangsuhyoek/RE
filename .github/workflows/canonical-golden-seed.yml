name: RE v2.0.2 Golden APK Seed

on:
  push:
    branches:
      - chatgpt/v2.0.3-canonical-baseline
    paths:
      - .github/workflows/canonical-golden-seed.yml
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Golden Product Baseline
        shell: bash
        env:
          GOLDEN_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-945c-8206-8c52-97d999177238/raw?se=2026-09-17T01%3A40%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=d8b4d7b0-ce5e-571e-ba91-946208f0c571&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T00%3A46%3A39Z&ske=2026-09-18T00%3A46%3A39Z&sks=b&skv=2026-02-06&sig=P6iX13Z0ncJZTiF1pHp89qgHlnnwlUilN55PUddVKFU%3D'
          GOLDEN_SHA256: c52bd20769fb84d8d4d882c7a985f3f792aa038184750dce9a86104efe77e7ac
        run: |
          set -euo pipefail
          mkdir -p golden
          curl -L --fail --retry 3 --retry-delay 2 "$GOLDEN_URL" -o golden/v2.0.2_수정.apk
          echo "$GOLDEN_SHA256  golden/v2.0.2_수정.apk" | sha256sum -c -
          test -s golden/v2.0.2_수정.apk
          sha256sum golden/v2.0.2_수정.apk | tee golden/golden.sha256

      - name: Upload Golden Product Baseline
        uses: actions/upload-artifact@v4
        with:
          name: re-v2.0.2-golden-product-baseline
          path: golden
          if-no-files-found: error
          retention-days: 90
