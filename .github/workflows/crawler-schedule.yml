name: Scheduled Crawler & Promotion Pipeline

on:
  schedule:
    # 주 1회 실행: 매주 월요일 03:00 UTC (12:00 KST)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Run promotion pipeline with --apply (scheduled runs always apply; uncheck for a report-only manual run)'
        required: false
        default: true
        type: boolean
      force_prune:
        description: 'Allow dropping more than 50% of live promotions if needed'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  crawl-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm (package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Crawler Pipeline
        run: pnpm crawl

      - name: Run Promotion Pipeline
        # 정기 실행(schedule)은 항상 --apply로 카탈로그·DB를 갱신한다. --force-prune은 수동 실행에서만 허용한다.
        run: |
          FLAGS=()
          if [ "${{ github.event_name == 'schedule' || inputs.apply == true }}" = "true" ]; then
            FLAGS+=("--apply")
          fi
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && inputs.force_prune == true }}" = "true" ]; then
            FLAGS+=("--force-prune")
          fi
          echo "promotion pipeline flags: ${FLAGS[*]:-(report only)}"
          node scripts/crawler/runPromotionPipeline.js "${FLAGS[@]}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run Verification Tests
        run: pnpm test
        env:
          TZ: Asia/Seoul

      - name: Create Pull Request on Data Changes
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(data): 정기 크롤러 파이프라인 수집 데이터 동기화'
          title: 'chore(data): 정기 크롤러 파이프라인 수집 데이터 동기화'
          body: |
            정기 크롤러 스케줄러(crawler-schedule.yml) 실행 결과 수집된 최신 데이터 변경 사항입니다.
            - 변경 파일: `src/data/subscriptionData.js`, `public/catalog/**`
            - 트리거: `${{ github.event_name }}`
          branch: 'data-update/crawler-scheduled'
          delete-branch: true

      # 환불 정책 페이지는 문구만 바뀌어도 실패로 판정된다.
      # 카탈로그 PR이 환불 점검 때문에 막히지 않도록 PR 단계 뒤에서 실행하고, 실패는 경고 주석으로 남긴다.
      - name: Run Refund Policy Check
        id: refund_check
        continue-on-error: true
        run: pnpm crawl:refunds

      - name: Annotate refund policy check result
        if: steps.refund_check.outcome == 'failure'
        run: |
          echo "::warning title=환불 정책 페이지 확인 필요::pnpm crawl:refunds 가 실패했습니다. 운영 DB는 이미 갱신되었고 카탈로그 PR은 생성되었습니다. 환불 정책 문구 변경 여부를 확인하세요."
