name: Build isolated NAVER WebGuide PoC

on:
  push:
    branches:
      - poc/naver-inapp-webguide-20260916
    paths:
      - 'poc-webguide/**'
      - '.github/workflows/poc-webguide.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PoC branch
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Use runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "sdkmanager not found"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode isolated project
        run: |
          rm -rf /tmp/re_webguide_poc
          python3 - <<'PY'
          import base64
          from pathlib import Path
          src = Path("poc-webguide/source.tar.gz.b64").read_text(encoding="utf-8")
          Path("/tmp/re_webguide_poc.tar.gz").write_bytes(base64.b64decode(src, validate=False))
          PY
          tar -xzf /tmp/re_webguide_poc.tar.gz -C /tmp
          test -f /tmp/re_webguide_poc/settings.gradle

      - name: Build debug APK
        working-directory: /tmp/re_webguide_poc
        run: gradle --no-daemon :demo-app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r /tmp/re_webguide_poc/demo-app/build/outputs/apk/debug/demo-app-debug.apk
            adb shell am force-stop com.re.webguide.demo
            adb shell am start -W -n com.re.webguide.demo/.DemoActivity
            sleep 2
            mkdir -p poc-runtime
            adb shell uiautomator dump /sdcard/re_launcher.xml
            adb pull /sdcard/re_launcher.xml poc-runtime/launcher.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET; root=ET.parse("poc-runtime/launcher.xml").getroot(); target=next((n for n in root.iter("node") if "Web Guide" in n.attrib.get("text","") and "네이버플러스" in n.attrib.get("text","")),None); assert target is not None,"Demo launch button not found"; m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",target.attrib["bounds"]); x=(int(m.group(1))+int(m.group(3)))//2; y=(int(m.group(2))+int(m.group(4)))//2; subprocess.run(["adb","shell","input","tap",str(x),str(y)],check=True)'
            sleep 12
            adb shell uiautomator dump /sdcard/re_web.xml || true
            adb pull /sdcard/re_web.xml poc-runtime/web.xml || true
            adb exec-out screencap -p > poc-runtime/naver-webview.png
            adb shell dumpsys activity activities > poc-runtime/activities.txt
            adb logcat -d -v time > poc-runtime/logcat.txt
            grep -q "com.re.webguide/.WebGuideActivity" poc-runtime/activities.txt || grep -q "com.re.webguide.demo" poc-runtime/activities.txt

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: RE-WebGuide-Naver-PoC-runtime
          path: poc-runtime/

      - name: Stage APK
        run: |
          mkdir -p poc-artifacts
          cp /tmp/re_webguide_poc/demo-app/build/outputs/apk/debug/demo-app-debug.apk \
             poc-artifacts/RE-WebGuide-Naver-PoC-debug.apk
          sha256sum poc-artifacts/RE-WebGuide-Naver-PoC-debug.apk \
             > poc-artifacts/RE-WebGuide-Naver-PoC-debug.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RE-WebGuide-Naver-PoC-debug
          path: |
            poc-artifacts/RE-WebGuide-Naver-PoC-debug.apk
            poc-artifacts/RE-WebGuide-Naver-PoC-debug.apk.sha256

      - name: Publish APK back to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poc-artifacts/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "poc: publish NAVER WebGuide debug APK [skip ci]"
          git push origin HEAD:poc/naver-inapp-webguide-20260916
