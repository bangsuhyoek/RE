name: Export Android zipalign v103

on:
  push:
    branches:
      - codex/re-v1.0.3-concierge
    paths:
      - '.github/workflows/export-zipalign-v103.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "build-tools;36.0.0"
      - name: Collect zipalign
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/zipalign
          chmod +x out/zipalign
          sha256sum out/zipalign > out/zipalign.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: zipalign-v103
          path: out/*
          if-no-files-found: error
