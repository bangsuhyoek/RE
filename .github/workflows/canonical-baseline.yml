name: RE v2.0.2 Canonical Baseline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Download stable Golden Product Baseline
        uses: actions/download-artifact@v4
        with:
          name: re-v2.0.2-golden-product-baseline
          path: golden
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35171158055

      - name: Restore exact Golden WebView payload
        shell: bash
        run: |
          set -euo pipefail
          GOLDEN=$(find golden -type f -name 'v2.0.2_수정.apk' -print -quit)
          test -n "$GOLDEN"
          test -s "$GOLDEN"
          echo "c52bd20769fb84d8d4d882c7a985f3f792aa038184750dce9a86104efe77e7ac  $GOLDEN" | sha256sum -c -
          rm -rf dist
          mkdir -p dist
          python3 - "$GOLDEN" dist <<'PY'
          import sys,zipfile,pathlib,hashlib,json
          apk,out=sys.argv[1:3]
          out=pathlib.Path(out)
          hashes={}
          with zipfile.ZipFile(apk) as z:
              for name in z.namelist():
                  prefix='assets/public/'
                  if not name.startswith(prefix) or name.endswith('/'):
                      continue
                  rel=name[len(prefix):]
                  dest=out/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  data=z.read(name)
                  dest.write_bytes(data)
                  hashes[rel]=hashlib.sha256(data).hexdigest()
          print(json.dumps({'web_files':len(hashes)},indent=2))
          if len(hashes)!=133:
              raise SystemExit(f'expected 133 Golden WebView files, got {len(hashes)}')
          pathlib.Path('golden-web-files.json').write_text(json.dumps(hashes,indent=2),encoding='utf-8')
          PY
          test -f dist/index.html
          test "$(find dist -type f | wc -l)" -eq 133

      - name: Install dependencies and sync Android
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          npx cap sync android

      - name: Assert baseline has no 2.5D integration
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "AnimatedConciergeOverlayController\|PocPaymentTriggerActivity\|PocPaymentReceiver" android/app/src/main; then
            echo "unexpected 2.5D PoC code in canonical baseline" >&2
            exit 1
          fi
          if grep -q "android.permission.SYSTEM_ALERT_WINDOW" android/app/src/main/AndroidManifest.xml; then
            echo "unexpected SYSTEM_ALERT_WINDOW manifest permission in canonical baseline" >&2
            exit 1
          fi

      - name: Clean build baseline APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (cd android && ./gradlew clean assembleDebug assembleRelease --stacktrace)

      - name: Verify rebuilt release against Golden payload
        shell: bash
        run: |
          set -euo pipefail
          DEBUG=android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE=android/app/build/outputs/apk/release/app-release-unsigned.apk
          GOLDEN=$(find golden -type f -name 'v2.0.2_수정.apk' -print -quit)
          test -s "$DEBUG"
          test -s "$RELEASE"
          test -s "$GOLDEN"
          unzip -t "$DEBUG" >/dev/null
          unzip -t "$RELEASE" >/dev/null
          python3 - "$RELEASE" "$GOLDEN" <<'PY'
          import sys,zipfile,hashlib,json,pathlib
          rebuilt,golden=sys.argv[1:3]
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  return {n:hashlib.sha256(z.read(n)).hexdigest()
                          for n in z.namelist()
                          if not n.startswith('META-INF/') and not n.endswith('/')}
          r=payload(rebuilt); g=payload(golden)
          report={
              'golden_count':len(g),
              'rebuilt_count':len(r),
              'missing_in_rebuilt':sorted(set(g)-set(r)),
              'extra_in_rebuilt':sorted(set(r)-set(g)),
              'changed':sorted(k for k in set(g)&set(r) if g[k]!=r[k]),
          }
          report['pass']=not report['missing_in_rebuilt'] and not report['extra_in_rebuilt'] and not report['changed']
          pathlib.Path('canonical-payload-parity.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not report['pass']:
              raise SystemExit(1)
          PY
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BT/aapt2" dump badging "$RELEASE" | tee canonical-badging.txt
          "$BT/aapt2" dump permissions "$RELEASE" | tee canonical-permissions.txt
          grep -q "package: name='kr.co.re.subscription' versionCode='202' versionName='2.0.2'" canonical-badging.txt
          ! grep -q "android.permission.SYSTEM_ALERT_WINDOW" canonical-permissions.txt
          sha256sum "$DEBUG" "$RELEASE" > canonical-apk.sha256

      - name: Sign exact release payload for runtime QA
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=android/app/build/outputs/apk/release/app-release-unsigned.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          KS=/tmp/re-canonical-baseline.jks
          keytool -genkeypair -noprompt -keystore "$KS" -storepass android -keypass android \
            -alias canonical -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=RE Canonical Baseline QA,O=RE,C=KR"
          "$BT/zipalign" -p -f 4 "$RELEASE" canonical-baseline-aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias canonical \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out canonical-baseline.apk canonical-baseline-aligned.apk
          "$BT/apksigner" verify --verbose canonical-baseline.apk
          rm canonical-baseline-aligned.apk
          sha256sum canonical-baseline.apk >> canonical-apk.sha256

      - name: Upload canonical baseline
        uses: actions/upload-artifact@v4
        with:
          name: re-v2.0.2-canonical-baseline-stable
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            canonical-baseline.apk
            canonical-payload-parity.json
            canonical-badging.txt
            canonical-permissions.txt
            canonical-apk.sha256
            golden-web-files.json
          if-no-files-found: error
          retention-days: 90
