name: Build RE Native Final APK

on:
  push:
    branches:
      - re-native-final-20260909

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Unpack Android Studio project
        run: |
          unzip -q build_source/RE_ANDROID_FINAL_NATIVE.zip
          sed -i 's/compileSdk = 37/compileSdk = 36/' RE_ANDROID_FINAL_NATIVE/app/build.gradle.kts

      - name: Build debug APK
        run: |
          cd RE_ANDROID_FINAL_NATIVE
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RE-Native-Final-Debug-APK
          path: RE_ANDROID_FINAL_NATIVE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
