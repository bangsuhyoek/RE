name: Build RE Native Final APK

on:
  push:
    branches:
      - re-native-final-20260909

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct and verify Android Studio project
        run: |
          cat \
            build_source/re_native_b64/current_head00 \
            build_source/re_native_b64/current_head01 \
            build_source/re_native_b64/part01 \
            build_source/re_native_b64/part02 \
            build_source/re_native_b64/part03 \
            build_source/re_native_b64/part04 \
            build_source/re_native_b64/part05 \
            build_source/re_native_b64/part06 \
            build_source/re_native_b64/current_tail14 \
            build_source/re_native_b64/current_tail15 \
            build_source/re_native_b64/current_tail16 \
            build_source/re_native_b64/current_tail17 \
            > /tmp/re-native.b64
          base64 --decode /tmp/re-native.b64 > /tmp/RE_ANDROID_FINAL_NATIVE.zip
          echo "1b13887089b758a34824af186844b44090c5c1139ae098db66a8764cb7a71c35  /tmp/RE_ANDROID_FINAL_NATIVE.zip" | sha256sum -c -
          unzip -t /tmp/RE_ANDROID_FINAL_NATIVE.zip
          unzip -q /tmp/RE_ANDROID_FINAL_NATIVE.zip

      - name: Run unit tests
        run: |
          cd RE_ANDROID_FINAL_NATIVE
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: |
          cd RE_ANDROID_FINAL_NATIVE
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RE-Native-Final-Debug-APK
          path: RE_ANDROID_FINAL_NATIVE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
