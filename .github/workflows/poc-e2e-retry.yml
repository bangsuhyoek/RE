name: RE v2.0.3 2.5D PoC Emulator E2E Retry

on:
  push:
    branches:
      - chatgpt/v2.0.3-2.5d-poc
    paths:
      - poc-e2e-retry-trigger.txt

jobs:
  emulator-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PoC branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install screenshot analysis tooling
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Download validated APK artifact
        uses: actions/download-artifact@v4
        with:
          name: re-v2.0.3-poc1-exact-v202
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35086149115

      - name: Verify downloaded APK exists
        shell: bash
        run: |
          set -euo pipefail
          find artifact -maxdepth 3 -type f -print
          APK=$(find artifact -type f -name '*.apk' -print -quit)
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee artifact-apk.sha256

      - name: Run NEW_SUBSCRIPTION_DETECTED E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash build-support/run-poc-e2e.sh artifact

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: re-v2.0.3-poc1-emulator-evidence-retry
          path: |
            e2e
            artifact-apk.sha256
          if-no-files-found: error
