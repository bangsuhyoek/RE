name: Build RE WebGuide Character PoC

on:
  push:
    branches:
      - chatgpt/re-webguide-character-poc-20260916
    paths:
      - 'poc/re-webguide-character/**'
      - '.github/workflows/build-re-webguide-character-poc.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Reassemble verified PoC source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/re-webguide-poc
          cat poc/re-webguide-character/source.b64.part* | tr -d '\n\r' | base64 --decode > /tmp/RE-WebGuide-Naver-Character-PoC-source.zip
          echo "9d38a63e12792615c73b4209317160db3af069e83622d199081c723342f3e413  /tmp/RE-WebGuide-Naver-Character-PoC-source.zip" | sha256sum -c -
          unzip -q /tmp/RE-WebGuide-Naver-Character-PoC-source.zip -d /tmp/re-webguide-poc

      - name: Security guardrails
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/re-webguide-poc/character_poc
          if grep -RInE 'SYSTEM_ALERT_WINDOW|TYPE_APPLICATION_OVERLAY|addJavascriptInterface' "$SRC/webguide/src/main" --exclude='*.md'; then
            echo "Forbidden overlay or JavaScript bridge API found."
            exit 1
          fi
          grep -q 'android.permission.INTERNET' "$SRC/webguide/src/main/AndroidManifest.xml"
          test -f "$SRC/webguide/src/main/res/drawable-nodpi/re_character_wave.webp"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p /tmp/re-webguide-poc/character_poc :demo-app:assembleDebug --stacktrace
          cp /tmp/re-webguide-poc/character_poc/demo-app/build/outputs/apk/debug/demo-app-debug.apk "$GITHUB_WORKSPACE/RE-WebGuide-Naver-Character-PoC.apk"
          unzip -t "$GITHUB_WORKSPACE/RE-WebGuide-Naver-Character-PoC.apk"
          sha256sum "$GITHUB_WORKSPACE/RE-WebGuide-Naver-Character-PoC.apk"

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/RE-WebGuide-Naver-Character-PoC.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^uses-permission:"
          echo "--- permissions ---"
          "$AAPT" dump permissions "$APK"
          echo "--- signature ---"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RE-WebGuide-Naver-Character-PoC
          path: RE-WebGuide-Naver-Character-PoC.apk
          if-no-files-found: error
          retention-days: 7
