name: RE Benefit V2

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        type: choice
        options: [active, shadow]
        default: active

permissions:
  contents: read

concurrency:
  group: re-benefit-v2
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://ssukvsphufvdaanqlmgj.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NAVER_SEARCH_API_KEY_ID: ${{ secrets.NAVER_SEARCH_API_KEY_ID }}
      NAVER_SEARCH_API_KEY: ${{ secrets.NAVER_SEARCH_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
      GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
      BENEFIT_GOLD_SET_PATH: ${{ vars.RE_BENEFIT_GOLD_SET_PATH }}
      BENEFIT_PIPELINE_MODE: ${{ inputs.mode || 'active' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify required server configuration
        shell: bash
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing SUPABASE_SERVICE_ROLE_KEY'; exit 2; }
          test -n "$GEMINI_API_KEY" || { echo 'Missing GEMINI_API_KEY'; exit 2; }
          if [ "$BENEFIT_PIPELINE_MODE" = active ]; then
            test -f "$BENEFIT_GOLD_SET_PATH" || { echo 'Configure RE_BENEFIT_GOLD_SET_PATH with a current independently verified reference'; exit 2; }
          fi
      - run: pnpm run crawl:benefits:v2 -- ${{ inputs.mode == 'shadow' && '--shadow' || '--active' }}
      - name: Upload collection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: re-benefit-v2-reports
          path: outputs/benefit-v2/
          if-no-files-found: ignore
