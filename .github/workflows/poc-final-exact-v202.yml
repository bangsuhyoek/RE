name: RE v2.0.3 2.5D PoC Exact v2.0.2 Build

on:
  push:
    branches:
      - chatgpt/v2.0.3-2.5d-poc
    paths:
      - poc-source-url.txt
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: re-v2.0.3-poc1-exact-v202
    steps:
      - name: Checkout PoC branch
        uses: actions/checkout@v4

      - name: Download exact v2.0.2 WebView Source of Truth
        shell: bash
        run: |
          set -euo pipefail
          test -s poc-source-url.txt
          URL="$(cat poc-source-url.txt)"
          curl --fail --location --retry 3 --retry-delay 2 "$URL" -o /tmp/re-v202-web.zip
          test -s /tmp/re-v202-web.zip
          echo "c419cb9a3088839d4dfa263e9993c301257650cb7d51ec60e43426745d716700  /tmp/re-v202-web.zip" | sha256sum -c -
          python - <<'PY'
          import zipfile
          p='/tmp/re-v202-web.zip'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              prefix='public/' if 'public/app.js' in names else ''
              required={
                  prefix+'app.js',prefix+'index.html',prefix+'styles.css',prefix+'src/native.js',prefix+'src/re-integration.js',
                  prefix+'assets/concierge/motions/re_motion_15_notification.webp',
                  prefix+'assets/concierge/motions/re_motion_21_subscription_checking.webp',
                  prefix+'assets/concierge/interactions/re_interaction_look.webp'
              }
              missing=sorted(required-names)
              assert not missing, missing
              assert len([n for n in names if n and not n.endswith('/')]) == 133
              print('Exact WebView source verified:', len(names), 'zip entries, prefix=',prefix)
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PoC asset tooling
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Reconstruct clean source with exact v2.0.2 WebView assets
        env:
          RE_WEB_ASSETS_ZIP: /tmp/re-v202-web.zip
        run: |
          set -euo pipefail
          python build-support/prepare-2_5d-poc.py "$GITHUB_WORKSPACE/poc-build-src"
          test -f poc-build-src/POC_2_5D_METADATA.json
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path('poc-build-src')
          meta=json.loads((root/'POC_2_5D_METADATA.json').read_text(encoding='utf-8'))
          assert meta['event']=='NEW_SUBSCRIPTION_DETECTED'
          assert meta['duration_ms']==5500
          assert len(meta['layers'])==9
          # Verify exact v2.0.2 assets that are not intentionally patched by the PoC bridge.
          expected={
            'index.html':'37bff276635caa57a0bf0cb82e94511e96647e520d0357e211e285d6d278fc36',
            'styles.css':'08f8fb7e74a2823614b50af03bea74d641d016dc3d71e4959fd046109577280f',
            'src/asset-urls.js':'1f8e724eea7e308809b7543c9395338bac3875df81dcd2da928d73826449d6ba',
            'assets/concierge/motions/re_motion_15_notification.webp':'578b56515f97671103c3358f919e7fd4273e462dfe93b0cf63c44a9d5cf82dff',
            'assets/concierge/motions/re_motion_21_subscription_checking.webp':'5e094a9272c13858d6ce4227c322285393c9457f83c587a9064c5a6f5521f9b9',
            'assets/concierge/interactions/re_interaction_look.webp':'5e094a9272c13858d6ce4227c322285393c9457f83c587a9064c5a6f5521f9b9'
          }
          for rel,sha in expected.items():
              got=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              assert got==sha,(rel,got,sha)
          print('Exact v2.0.2 untouched asset hashes PASS')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Install dependencies
        working-directory: poc-build-src
        run: pnpm install --frozen-lockfile

      - name: Validate current v2.0.2 plus PoC contracts
        run: |
          set -euo pipefail
          python build-support/validate-2_5d-poc.py poc-build-src
          node --check poc-build-src/app.js
          node --check poc-build-src/src/re-integration.js
          node --check poc-build-src/src/native.js

      - name: Build WebView
        working-directory: poc-build-src
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Use preinstalled Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "Build tools:"
          ls -1 "$ANDROID_HOME/build-tools" | tail -n 20
          echo "Platforms:"
          ls -1 "$ANDROID_HOME/platforms" | tail -n 20
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Capacitor sync
        working-directory: poc-build-src
        run: pnpm cap:sync

      - name: Gradle clean build
        working-directory: poc-build-src/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Static APK validation
        shell: bash
        run: |
          set -euo pipefail
          APK=poc-build-src/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          "$BT/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='kr.co.re.subscription' versionCode='203' versionName='2.0.3-poc1'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt

          "$BT/aapt2" dump permissions "$APK" | tee apk-permissions.txt
          grep -q "android.permission.SYSTEM_ALERT_WINDOW" apk-permissions.txt
          if grep -q "android.permission.CAMERA" apk-permissions.txt; then
            echo "CAMERA permission must not be present" >&2
            exit 1
          fi

          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > apk-manifest-tree.txt
          grep -q "PocPaymentTriggerActivity" apk-manifest-tree.txt
          grep -q "PaymentNotificationListener" apk-manifest-tree.txt

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q "^Verifies$" apk-signature.txt
          "$BT/zipalign" -c -v 4 "$APK" > zipalign.txt

          python - "$APK" <<'PY'
          import json, pathlib, subprocess, sys, tempfile, zipfile
          apk=pathlib.Path(sys.argv[1])
          bt=sorted((pathlib.Path(__import__('os').environ['ANDROID_HOME'])/'build-tools').iterdir(), key=lambda p: tuple(map(int,p.name.split('.')[:3])))[-1]
          with tempfile.TemporaryDirectory() as td:
              td=pathlib.Path(td)
              with zipfile.ZipFile(apk) as z:
                  names=set(z.namelist())
                  required=['assets/concierge/new_subscription_detected.json'] + [
                      f'assets/concierge/images/{n}.png'
                      for n in ['hair_back','body','head_face','hair_front','left_arm','right_arm','phone','eyes','shadow']
                  ]
                  missing=[x for x in required if x not in names]
                  assert not missing, missing
                  j=json.loads(z.read('assets/concierge/new_subscription_detected.json'))
                  assert round((j['op']-j['ip'])/j['fr']*1000)==5500
                  assert len(j['layers'])==9
                  assert all(x['ks']['p']['a']==1 and x['ks']['s']['a']==1 and x['ks']['r']['a']==1 for x in j['layers'])
                  dex_names=[n for n in names if pathlib.PurePosixPath(n).name.startswith('classes') and n.endswith('.dex')]
                  all_classes=[]
                  for name in dex_names:
                      dest=td/pathlib.PurePosixPath(name).name
                      dest.write_bytes(z.read(name))
                      out=subprocess.check_output([str(bt/'dexdump'),'-f',str(dest)],text=True,errors='ignore')
                      for line in out.splitlines():
                          if 'Class descriptor' in line and "'" in line:
                              all_classes.append(line.split("'")[1])
                  from collections import Counter
                  dup=[k for k,v in Counter(all_classes).items() if v>1]
                  assert not dup, dup[:20]
                  print('DEX duplicate classes: 0')
                  print('2.5D layer count: 9')
                  print('Lottie duration: 5500ms')
          PY

          sha256sum "$APK" | tee apk.sha256
          cp "$APK" RE_v2.0.3_POC1_NEW_SUBSCRIPTION_2.5D.apk

      - name: Upload APK and static validation
        uses: actions/upload-artifact@v4
        with:
          name: re-v2.0.3-poc1-exact-v202
          path: |
            RE_v2.0.3_POC1_NEW_SUBSCRIPTION_2.5D.apk
            apk-badging.txt
            apk-permissions.txt
            apk-manifest-tree.txt
            apk-signature.txt
            zipalign.txt
            apk.sha256
            poc-build-src/POC_2_5D_METADATA.json
          if-no-files-found: error

  emulator-e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PoC branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install screenshot analysis tooling
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: re-v2.0.3-poc1-exact-v202
          path: artifact

      - name: Run NEW_SUBSCRIPTION_DETECTED E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash build-support/run-poc-e2e.sh artifact

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: re-v2.0.3-poc1-emulator-evidence
          path: e2e
          if-no-files-found: warn
